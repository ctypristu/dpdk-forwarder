# ACL 规则示例
#
# 每行格式：
#   <源IP> <目的IP> <源端口> <目的端口> <协议号> <pass|drop>
#
# 说明：
#   - 端口和协议当前是精确匹配，写 0 表示匹配 0（暂不支持通配）
#   - 协议号：6 = TCP，17 = UDP，1 = ICMP
#   - 以 # 开头的行为注释，空行忽略
#
# 加载方式：
#   sudo ./build/dpdk-forwarder --no-huge -l 0-1 \
#       --vdev=net_tap0,iface=dtap0 --vdev=net_tap1,iface=dtap1 -- \
#       --acl config/acl.conf

# 放行 10.99.99.2 → 10.99.99.1 的 ICMP
10.99.99.2 10.99.99.1 0 0 1 pass

# 丢弃反方向
10.99.99.1 10.99.99.2 0 0 1 drop

# 放行某个 TCP 会话
10.0.0.1 10.0.0.2 12345 80 6 pass

# 拒绝来自某地址的 Web 访问
10.0.0.9 10.0.0.2 0 80 6 drop
